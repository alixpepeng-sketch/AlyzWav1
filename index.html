<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALYZ WHATSAPP</title>
<script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#app{width:100%;max-width:440px;height:100%;background:#000;position:relative;overflow:hidden;display:flex;flex-direction:column}
.page{position:absolute;left:0;top:0;right:0;bottom:0;display:none;flex-direction:column;background:#000;z-index:10}
.page.active{display:flex}
.fixed-bg{position:absolute;left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:.4;z-index:1}
.btn{height:56px;background:#FFF;border:3px solid #000;border-radius:16px;box-shadow:5px 5px 0 #000;font-size:15px;font-weight:900;text-transform:uppercase;color:#000;display:flex;justify-content:center;align-items:center;margin-top:10px}
.wrap-auth{position:relative;z-index:2;padding:24px 16px;flex:1;display:flex;flex-direction:column;overflow:auto}
.inputBox{height:50px;background:#FFF;border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;padding:0 14px;display:flex;align-items:center;margin-bottom:12px}
.inputBox input{width:100%;font-size:15px;font-weight:700;color:#000;border:none;outline:none;background:transparent}
.top-nav{position:absolute;top:0;left:0;right:0;height:62px;background:#FFF;border-bottom:3px solid #000;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:20}
#berandaList{position:absolute;top:110px;bottom:0;left:0;right:0;overflow-y:auto;padding:0 12px 100px 12px;z-index:10}
.chatCard{width:100%;height:76px;background:#000;border:2px solid #FFF;border-radius:18px;box-shadow:4px 4px 0 #FFF;display:flex;align-items:center;padding:0 12px;margin-bottom:10px}
.cAvatar{width:52px;height:52px;border-radius:50%;border:2px solid #FFF;overflow:hidden;background:#A6937C;flex-shrink:0}
.cAvatar img{width:100%;height:100%}
.cMid{flex:1;min-width:0;margin-left:10px}
.cName{font-size:13px;font-weight:900;color:#FFF;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cMsg{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.navWrap{position:absolute;bottom:0;left:0;right:0;padding:0 12px 12px;z-index:20}
.nav{height:56px;background:#FFF;border:3px solid #000;border-radius:999px;box-shadow:5px 5px 0 #000;display:flex;justify-content:space-around;align-items:center}
.navItem{font-size:10px;font-weight:900}
.top-room{position:absolute;top:0;left:0;right:0;height:62px;background:#FFF;border-bottom:3px solid #000;display:flex;align-items:center;padding:0 10px;z-index:20}
#roomMsgs{position:absolute;top:62px;bottom:62px;left:0;right:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column}
.bubble{max-width:78%;border:2px solid #000;border-radius:16px;padding:10px 12px;box-shadow:3px 3px 0 #000;margin-bottom:8px;font-size:13px}
.bubble.me{align-self:flex-end;background:#FFF}
.bubble.other{align-self:flex-start;background:#EDE9E3}
.bottom-room{position:absolute;bottom:0;left:0;right:0;height:62px;background:#FFF;border-top:3px solid #000;display:flex;align-items:center;padding:0 10px;gap:8px;z-index:20}
.inputWrap{flex:1;height:42px;border:2px solid #000;border-radius:999px;background:#F5F5F0;display:flex;align-items:center;padding:0 14px}
.inputWrap input{flex:1;font-size:13px;border:none;outline:none;background:transparent}
.overlayModal{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:100;display:none;justify-content:center;align-items:center;padding:20px}
.modalCard{width:100%;background:#FFF;border:3px solid #000;border-radius:18px;box-shadow:6px 6px 0 #000;padding:20px;display:flex;flex-direction:column}
.modalInput{height:46px;border:2px solid #000;border-radius:12px;box-shadow:3px 3px 0 #000;padding:0 12px;margin-bottom:10px;font-weight:700}
</style>
</head>
<body>
<div id="app">
<div id="page-login" class="page active"><div id="loginBg" class="fixed-bg" style="background-image:url(https://files.catbox.moe/0v1r5p.jpg)"></div><div class="wrap-auth"><b style="font-size:26px;font-weight:900;color:#FFF">ALYZ<br>WHATSAPP</b><p style="color:rgba(255,255,255,.6);font-size:12px;margin:8px 0 20px;font-weight:700">Versi Lollipop - Tanpa OTP - Gratis 100%</p><div style="color:#FFF;font-size:11px;font-weight:900;margin-bottom:6px">NAMA</div><div class="inputBox"><input type="text" id="loginNama" placeholder="CONTOH: ALYZ"></div><div style="color:#FFF;font-size:11px;font-weight:900;margin-bottom:6px">NOMER</div><div class="inputBox"><input type="tel" id="loginNomer" placeholder="62xxxxxxxxxx"></div><div class="btn" onclick="loginGratis()">MASUK APK</div><p style="color:rgba(255,255,255,.4);font-size:10px;margin-top:10px;text-align:center">Support Android 5.0 Lollipop - AppGeyser Ready</p></div></div>
<div id="page-beranda" class="page"><div id="berandaBg" class="fixed-bg" style="background-image:url(https://files.catbox.moe/0v1r5p.jpg)"></div><div class="top-nav"><b>ALYZ WHATSAPP</b><div style="display:flex;gap:8px"><div onclick="openModal('overlayAdd')" style="width:38px;height:38px;border:2px solid #000;border-radius:10px;background:#FFF;display:flex;justify-content:center;align-items:center;font-weight:900">+</div></div></div><div style="position:absolute;top:62px;left:0;right:0;padding:10px 12px;z-index:15"><div style="height:42px;background:#FFF;border:2px solid #000;border-radius:999px;display:flex;align-items:center;padding:0 14px"><input type="text" id="searchInp" placeholder="Cari kontak" oninput="renderList()" style="flex:1;border:none;outline:none;font-weight:700;font-size:12px"></div></div><div id="berandaList"></div><div class="navWrap"><div class="nav"><div class="navItem" onclick="showPage('page-beranda')">HOME</div><div class="navItem" onclick="showPage('page-profil')">PROFIL</div></div></div></div>
<div id="page-profil" class="page"><div id="profilBg" class="fixed-bg" style="background-image:url(https://files.catbox.moe/0v1r5p.jpg)"></div><div style="padding:20px;z-index:2;position:relative"><b style="font-size:22px;color:#FFF">PROFIL</b></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;z-index:2;padding-top:20px"><div style="width:140px;height:140px;border-radius:50%;border:3px solid #000;overflow:hidden;background:#A6937C"><img id="photoBig" src="https://files.catbox.moe/0v1r5p.jpg" style="width:100%;height:100%"></div><input type="text" id="namaUser" style="margin-top:20px;font-size:18px;font-weight:900;color:#FFF;text-align:center;background:transparent;border:none;width:80%" onblur="saveName()"><div id="nomerUser" style="color:#FFF;margin-top:6px;font-weight:700">62xxx</div><div class="btn" style="background:#C49A94;padding:0 30px;height:46px;margin-top:20px" onclick="doLogout()">LOGOUT</div></div><div class="navWrap"><div class="nav"><div class="navItem" onclick="showPage('page-beranda')">HOME</div><div class="navItem" onclick="showPage('page-profil')">PROFIL</div></div></div></div>
<div id="page-room" class="page"><div id="roomBg" class="fixed-bg" style="background-image:url(https://files.catbox.moe/0v1r5p.jpg)"></div><div class="top-room"><div onclick="showPage('page-beranda')" style="width:36px;height:36px;border:2px solid #000;border-radius:10px;background:#FFF;display:flex;justify-content:center;align-items:center;font-weight:900"><</div><div style="width:40px;height:40px;border-radius:50%;border:2px solid #000;overflow:hidden;margin-left:8px;background:#A6937C"><img id="roomAvatar" src="https://files.catbox.moe/0v1r5p.jpg" style="width:100%;height:100%"></div><div style="margin-left:8px"><div id="roomNama" style="font-size:13px;font-weight:900">NAMA</div><div id="roomStatus" style="font-size:10px">ONLINE</div></div></div><div id="roomMsgs"></div><div class="bottom-room"><div onclick="document.getElementById('fileInput').click()" style="width:42px;height:42px;border:2px solid #000;border-radius:12px;background:#EDE9E3;display:flex;justify-content:center;align-items:center">+</div><input type="file" id="fileInput" style="display:none" accept="image/*" onchange="sendFile(event)"><div class="inputWrap"><input type="text" id="roomInp" placeholder="Ketik Pesan..."></div><div onclick="sendText()" style="width:42px;height:42px;border:2px solid #000;border-radius:12px;background:#000;color:#FFF;display:flex;justify-content:center;align-items:center">></div></div></div>
<div id="overlayAdd" class="overlayModal"><div class="modalCard"><b style="font-weight:900">TAMBAH KONTAK</b><input type="text" id="namaAdd" class="modalInput" placeholder="NAMA" style="margin-top:12px"><input type="tel" id="nomerAdd" class="modalInput" placeholder="62xxx"><div style="display:flex;gap:10px"><div class="btn" style="flex:1;height:44px" onclick="closeModals()">BATAL</div><div class="btn" style="flex:1;height:44px;background:#000;color:#FFF" onclick="simpanKontak()">SIMPAN</div></div></div></div>
</div>
<script>
var firebaseConfig = { apiKey: "AIzaSyAyKw5JZ-VlTs8wK40E2Z6pJH_3wCSF0U8", authDomain: "web-store-12856.firebaseapp.com", databaseURL: "https://web-store-12856-default-rtdb.firebaseio.com", projectId: "web-store-12856", storageBucket: "web-store-12856.firebasestorage.app", messagingSenderId: "72980085852", appId: "1:72980085852:web:9f30a318b821adacc83a99" };
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var myId = localStorage.getItem('uid') || '';
var myNomer = localStorage.getItem('nomer') || '';
var currentTargetNomer = '';
var allContacts = []; var chatsMeta = {}; var usersMeta = {};
function showPage(id){ var pages=document.querySelectorAll('.page'); for(var i=0;i<pages.length;i++) pages[i].className='page'; document.getElementById(id).className='page active'; if(id=='page-beranda') renderList(); }
function openModal(id){ document.getElementById(id).style.display='flex'; } function closeModals(){ var modals=document.querySelectorAll('.overlayModal'); for(var i=0;i<modals.length;i++) modals[i].style.display='none'; }
function formatPhone(num){ num=num.replace(/[^0-9]/g,''); if(num.indexOf('0')==0) num='62'+num.substring(1); if(num.indexOf('62')!=0) num='62'+num; return num; }
function loginGratis(){ var nama=document.getElementById('loginNama').value.replace(/^\s+|\s+$/g,''); var nomer=document.getElementById('loginNomer').value.replace(/^\s+|\s+$/g,''); if(!nama||!nomer){ alert('Isi nama dan nomer dulu cik!'); return; } nomer=formatPhone(nomer); myId = 'user_' + nomer; myNomer = nomer; localStorage.setItem('uid', myId); localStorage.setItem('nomer', myNomer); db.ref('users/'+myId).update({ uid: myId, name: nama, nomer: '+' + myNomer, online: true, lastSeen: Date.now() }).then(function(){ showPage('page-beranda'); initApp(); }); }
function doLogout(){ if(myId){ db.ref('users/'+myId).update({online:false}); } localStorage.clear(); myId=''; myNomer=''; showPage('page-login'); }
function saveName(){ var newName=document.getElementById('namaUser').value; if(newName&&myId){ db.ref('users/'+myId).update({name:newName}); } }
function simpanKontak(){ var nama=document.getElementById('namaAdd').value; var nomer=document.getElementById('nomerAdd').value; if(nama&&nomer&&myId){ if(nomer.indexOf('62')!=0) nomer='62'+nomer; db.ref('contacts/'+myId).push({nama:nama,nomer:nomer,created:Date.now()}); } closeModals(); document.getElementById('namaAdd').value=''; document.getElementById('nomerAdd').value=''; }
function initApp(){ if(!myId) return; db.ref('users/'+myId).update({online:true}); db.ref('users/'+myId).on('value',function(snap){ var data=snap.val(); if(data){ document.getElementById('namaUser').value=data.name||''; document.getElementById('nomerUser').innerHTML=data.nomer||''; } }); db.ref('contacts/'+myId).on('value',function(snap){ allContacts=[]; snap.forEach(function(child){ var c=child.val(); allContacts.push(c); listenUser(c.nomer); }); renderList(); }); }
function listenUser(targetNomer){ db.ref('users').orderByChild('nomer').equalTo('+'+targetNomer).on('value',function(snap){ snap.forEach(function(child){ usersMeta[targetNomer]=child.val(); }); renderList(); }); var chatId=myId+'_'+targetNomer; db.ref('chats/'+chatId+'/messages').limitToLast(1).on('value',function(snap){ var lastMsg=''; snap.forEach(function(child){ var m=child.val(); lastMsg=m.type=='image'?'[Gambar]':m.text; }); if(!chatsMeta[targetNomer]) chatsMeta[targetNomer]={}; chatsMeta[targetNomer].lastMsg=lastMsg; renderList(); }); }
function renderList(){ var search=(document.getElementById('searchInp').value||'').toLowerCase(); var listEl=document.getElementById('berandaList'); var html=''; for(var i=0;i<allContacts.length;i++){ var c=allContacts[i]; var metaU=usersMeta[c.nomer]||{}; var metaC=chatsMeta[c.nomer]||{}; var dName=c.nama||metaU.name||c.nomer; if(search&&dName.toLowerCase().indexOf(search)==-1) continue; html+='<div class="chatCard" onclick="openRoom(\''+c.nomer+'\')"><div class="cAvatar"><img src="'+(metaU.photo||'https://files.catbox.moe/0v1r5p.jpg')+'"></div><div class="cMid"><div class="cName">'+dName+'</div><div class="cMsg">'+(metaC.lastMsg||'Belum ada obrolan')+'</div></div></div>'; } listEl.innerHTML=html; }
var roomMsgsRef;
function openRoom(targetNomer){ currentTargetNomer=targetNomer; var metaU=usersMeta[targetNomer]||{}; document.getElementById('roomNama').innerHTML=metaU.name||targetNomer; document.getElementById('roomStatus').innerHTML= metaU.online ? 'ONLINE' : 'OFFLINE'; var chatId=myId+'_'+targetNomer; document.getElementById('roomMsgs').innerHTML=''; if(roomMsgsRef) roomMsgsRef.off(); roomMsgsRef=db.ref('chats/'+chatId+'/messages'); roomMsgsRef.on('child_added',function(snap){ var msg=snap.val(); var dt=new Date(msg.ts); var timeStr=dt.getHours()+':'+('0'+dt.getMinutes()).slice(-2); var isMe=msg.uid==myId; var div=document.createElement('div'); div.className='bubble '+(isMe?'me':'other'); var content=''; if(msg.type=='image'){ content='<img src="'+msg.data+'" style="width:100%;border-radius:8px;border:2px solid #000;margin-bottom:4px">'; } content+= (msg.text||'') + '<span style="font-size:9px;opacity:.5;display:block;text-align:right;margin-top:4px">'+timeStr+'</span>'; div.innerHTML=content; document.getElementById('roomMsgs').appendChild(div); document.getElementById('roomMsgs').scrollTop=document.getElementById('roomMsgs').scrollHeight; }); showPage('page-room'); }
function sendText(){ var inp=document.getElementById('roomInp'); var text=inp.value.replace(/^\s+|\s+$/g,''); if(!text||!currentTargetNomer) return; inp.value=''; var chatId=myId+'_'+currentTargetNomer; db.ref('users').orderByChild('nomer').equalTo('+'+currentTargetNomer).once('value').then(function(snap){ var targetUid=''; snap.forEach(function(child){ targetUid=child.val().uid; }); var msgData={ uid:myId, text:text, type:'text', ts:Date.now() }; db.ref('chats/'+chatId+'/messages').push(msgData); if(targetUid){ var chatIdRev=targetUid+'_'+myNomer; db.ref('chats/'+chatIdRev+'/messages').push(msgData); } }); }
function sendFile(e){ var file=e.target.files[0]; if(!file||!currentTargetNomer) return; var reader=new FileReader(); reader.onload=function(evt){ var base64=evt.target.result; var chatId=myId+'_'+currentTargetNomer; db.ref('users').orderByChild('nomer').equalTo('+'+currentTargetNomer).once('value').then(function(snap){ var targetUid=''; snap.forEach(function(child){ targetUid=child.val().uid; }); var msgData={ uid:myId, type:'image', data:base64, ts:Date.now() }; db.ref('chats/'+chatId+'/messages').push(msgData); if(targetUid){ var chatIdRev=targetUid+'_'+myNomer; db.ref('chats/'+chatIdRev+'/messages').push(msgData); } }); }; reader.readAsDataURL(file); }
if(localStorage.getItem('uid')){ initApp(); showPage('page-beranda'); }
</script>
</body>
</html>
